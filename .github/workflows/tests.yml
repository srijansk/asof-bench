# The unit tests, the tests of systems/ and the lint on every push to main and every pull request.
# The corpus tests need the three full clones (ASOFBENCH_CLONES) and are skipped here;
# CONTRIBUTING.md says how to run them.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the section-15 guard reads the history
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.7.2
      - run: uv run --frozen --python "${{ steps.python.outputs.python-path }}" --extra dev pytest
      - run: uv run --frozen --python "${{ steps.python.outputs.python-path }}" --extra dev pytest systems/tests
      - run: uv run --frozen --python "${{ steps.python.outputs.python-path }}" --extra dev ruff check src tests examples systems
