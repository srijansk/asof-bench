# Graphiti's run environment (systems/README.md): the egress proxy, the embedding server, Neo4j and
# the Graphiti container on `inner`, an internal network with no route out and no address of the
# host on it, and the proxy alone also on `outer`. Each run is one compose project, so that its
# Neo4j store is a volume of its own (`<project>_neo4j-data`) and arms never share one:
#
#     ASOFBENCH_RUN_INPUT=<a directory holding the run's input stream and no other stream> \
#     ASOFBENCH_RUN_OUTPUT=<the run's output directory> \
#     ASOFBENCH_ANTHROPIC_KEY_FILE=<the file that holds the API key> \
#     ASOFBENCH_IMAGE_IDS=<graphiti=sha256:...,egress=sha256:...,embedder=sha256:...,neo4j=sha256:...> \
#     docker compose -f systems/graphiti/compose.yaml -p asofbench-graphiti-<run> \
#         run --rm graphiti ingest --stream /input/<file>.jsonl --arm H+ --out /output
#
# The first three variables are absolute paths (compose reads a relative one from this file's
# directory) and are needed by every compose command on this file, `down` included. The key
# reaches the container only as the Docker secret /run/secrets/anthropic_api_key. The image IDs,
# which README.md says how to read, are recorded in the run's outputs; ingest refuses to start
# without them.
#
# Each service has a memory limit, and each is the first that the kernel stops if the machine
# runs short of memory (oom_score_adj), so that a shortage stops this run and nothing else. The
# proxy, the embedding server and Neo4j restart when they stop without a `docker stop` (an
# out-of-memory kill included); an ingestion that one of them interrupts stops with exit status
# 2, to be resumed (README.md).
name: asofbench-graphiti

services:
  egress:
    image: asofbench/egress
    build: ../env/egress
    environment:
      EGRESS_ALLOW: api.anthropic.com:443
      # Longer than the 600 s the client gives a request (config.json), so that the proxy never
      # closes a tunnel while the client still waits on a response.
      EGRESS_IDLE_TIMEOUT: "660"
    networks:
      - inner
      - outer
    mem_limit: 128m
    oom_score_adj: 1000
    restart: unless-stopped

  embedder:
    image: asofbench/embedder
    build: ../env/embedder
    # glibc's allocator, set for memory only: by default it gives each thread its own arena and
    # raises its mmap threshold after large frees, which can keep the activation buffers of large
    # batches resident. Without these settings M0's server read up to 1.48 GiB, and it was ended
    # and restarted twice, most likely by the Docker VM's out-of-memory killer; with two arenas
    # and a fixed 128 KiB mmap threshold it read 491 to 593 MiB, as results/m0 records. The
    # model, its weights, its dtype and every vector are the same with or without these.
    environment:
      MALLOC_ARENA_MAX: "2"
      MALLOC_MMAP_THRESHOLD_: "131072"
      MALLOC_TRIM_THRESHOLD_: "131072"
    networks:
      - inner
    mem_limit: 2560m
    oom_score_adj: 1000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 120
      start_period: 30s

  neo4j:
    image: neo4j:5.26.32-community@sha256:249a1ec6e3c52d82101a5ed33d6ed2b5ed5b0017b21a28c0bfebc335e87fb177
    environment:
      NEO4J_AUTH: none
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j-data:/data
    networks:
      - inner
    # 1.5 GiB, with the heap (512 MiB at most) and the page cache (128 MiB) as they are: at a
    # 1 GiB limit M0's Neo4j read up to 972 MiB, well beyond its heap and page cache, and
    # restarted during a commit once the store held about 900 episodes; at 1.5 GiB it read
    # 1.20 GiB with 1,117 episodes logged, as results/m0 records.
    mem_limit: 1536m
    oom_score_adj: 1000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7474/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  graphiti:
    image: asofbench/graphiti
    build:
      context: ..
      dockerfile: graphiti/Dockerfile
    environment:
      HTTPS_PROXY: http://egress:3128
      NO_PROXY: neo4j,embedder,localhost,127.0.0.1
      GRAPHITI_TELEMETRY_ENABLED: "false"
      ASOFBENCH_IMAGE_IDS: ${ASOFBENCH_IMAGE_IDS:-}
    volumes:
      - ${ASOFBENCH_RUN_INPUT:?}:/input:ro
      - ${ASOFBENCH_RUN_OUTPUT:?}:/output
    secrets:
      - anthropic_api_key
    networks:
      - inner
    mem_limit: 1g
    oom_score_adj: 1000
    depends_on:
      egress:
        condition: service_started
      embedder:
        condition: service_healthy
      neo4j:
        condition: service_healthy

networks:
  inner:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  outer: {}

volumes:
  neo4j-data: {}

secrets:
  anthropic_api_key:
    file: ${ASOFBENCH_ANTHROPIC_KEY_FILE:?}
